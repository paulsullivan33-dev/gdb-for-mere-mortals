site_name: GDB for Mere Mortals
site_description: The GNU debugger, for programs that crash or give the wrong answer. Stopping a running program, reading its variables and its call stack, catching the moment a value changes, and examining what a crash left behind, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/gdb-for-mere-mortals/
